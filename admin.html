<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#10b981" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
  <meta name="description" content="Panel de administración MANNOL — gestión de usuarios, productos, almacenes y configuración." />
  <meta name="application-name" content="MANNOL Admin" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MANNOL Admin" />
  <meta name="format-detection" content="telephone=no" />
  <title>MANNOL · Panel Admin</title>

  <!-- Styles -->
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" sizes="180x180" />
  <link rel="stylesheet" href="./css/styles.css" />

  <!-- Theme bootstrap (evita FOUC) -->
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('almacen-pos-state-v1');
        var theme = 'system';
        if (stored) {
          var parsed = JSON.parse(stored);
          if (parsed.theme) theme = parsed.theme;
        }
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = theme === 'dark' || (theme === 'system' && systemDark);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>

  <style>
    /* Admin-specific layout — sidebar oscura de marca + contenido claro */
    .admin-shell {
      display: flex;
      min-height: 100vh;
      background: var(--bg);
    }
    .admin-sidebar {
      width: 17rem;
      flex-shrink: 0;
      background: linear-gradient(180deg, oklch(0.19 0.02 235) 0%, oklch(0.155 0.018 235) 100%);
      border-right: 1px solid oklch(1 0 0 / 6%);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .admin-sidebar-header {
      padding: 1rem 1rem 0.875rem;
      border-bottom: 1px solid oklch(1 0 0 / 8%);
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }
    .admin-sidebar-header p { color: oklch(0.96 0.008 235); }
    .admin-sidebar-header .text-muted { color: oklch(0.68 0.015 235) !important; }
    .admin-sidebar-nav {
      flex: 1;
      padding: 0.375rem 0.5rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.125rem;
    }
    .admin-nav-item {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.5rem 0.625rem;
      border: none;
      background: transparent;
      color: oklch(0.82 0.012 235);
      text-align: left;
      cursor: pointer;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
      width: 100%;
      position: relative;
    }
    .admin-nav-item:hover {
      background: oklch(1 0 0 / 7%);
      color: oklch(0.96 0.008 235);
    }
    .admin-nav-item.active {
      background: color-mix(in oklab, var(--primary) 30%, oklch(1 0 0 / 6%));
      color: oklch(0.97 0.02 165);
      font-weight: 600;
      box-shadow: inset 0 0 0 1px oklch(1 0 0 / 10%);
    }
    .admin-nav-item.active::before {
      content: '';
      position: absolute;
      left: -0.5rem;
      top: 0.375rem;
      bottom: 0.375rem;
      width: 3px;
      border-radius: 999px;
      background: var(--primary);
    }
    .admin-nav-item-icon {
      width: 1.75rem;
      height: 1.75rem;
      border-radius: var(--radius-sm);
      background: oklch(1 0 0 / 8%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .admin-nav-item.active .admin-nav-item-icon { background: oklch(1 0 0 / 16%); }
    .admin-nav-item[style*="danger"] { color: oklch(0.75 0.16 25) !important; }
    .admin-nav-item[style*="danger"]:hover { background: oklch(0.58 0.2 25 / 18%); }
    .admin-nav-item[style*="danger"] .admin-nav-item-icon { background: oklch(0.58 0.2 25 / 22%); }
    .admin-nav-section-label {
      padding: 0.875rem 0.75rem 0.3125rem;
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: oklch(0.6 0.015 235);
    }
    .admin-nav-badge {
      margin-left: auto !important;
      background: var(--danger) !important;
      color: white !important;
      font-size: 0.625rem !important;
      font-weight: 700 !important;
      padding: 0.125rem 0.4375rem !important;
      border-radius: var(--radius-full) !important;
      min-width: 1.25rem !important;
      text-align: center !important;
    }
    .admin-sidebar-footer {
      padding: 0.625rem;
      border-top: 1px solid oklch(1 0 0 / 8%);
    }
    .admin-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(at 100% 0%, color-mix(in oklab, var(--primary) 4%, transparent) 0px, transparent 42%),
        var(--bg);
    }
    .admin-topbar {
      background: color-mix(in oklab, var(--bg) 78%, transparent);
      backdrop-filter: blur(12px) saturate(150%);
      -webkit-backdrop-filter: blur(12px) saturate(150%);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .admin-topbar .btn-ghost.btn-icon {
      border-radius: var(--radius);
      border: 1px solid transparent;
    }
    .admin-topbar .btn-ghost.btn-icon:hover {
      background: var(--bg-elevated);
      border-color: var(--border);
      box-shadow: var(--shadow-sm);
    }
    .admin-content {
      padding: 1.5rem 2rem 2.5rem;
      max-width: 96rem;
      width: 100%;
      margin: 0 auto;
      overflow-x: hidden;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .admin-content > * { min-width: 0; }
    #admin-page-title { letter-spacing: -0.02em; }
    /* Mobile: sidebar collapse */
    .admin-sidebar-toggle { display: none; }
    @media (max-width: 768px) {
      .admin-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.22s ease;
        box-shadow: var(--shadow-lg);
        border-radius: 0 var(--radius-xl) var(--radius-xl) 0;
      }
      .admin-sidebar.open { transform: translateX(0); }
      .admin-sidebar-toggle { display: flex; }
      .admin-content { padding: 1rem 1rem 2rem; }
      .admin-topbar { padding: 0.625rem 1rem; }
    }
    .admin-sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 12, 20, 0.5);
      backdrop-filter: blur(2px);
      z-index: 40;
    }
    .admin-sidebar-overlay.show { display: block; }
    /* Loading screen */
    .admin-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-muted);
      background: var(--bg);
    }
    .admin-loading .spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <!-- v5.9.0: mismo estilo que la app (tarjetas flotantes, líneas definidas, tablas legibles
       en móvil). Va DESPUÉS del <style> de arriba para que sus reglas manden. -->
  <link rel="stylesheet" href="./css/mobile-ux.css" />
</head>
<body>
  <div id="admin-app">
    <div class="admin-loading">
      <div class="spinner"></div>
      <p>Cargando panel admin…</p>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Modal container -->
  <div id="modal-container"></div>

  <!-- Bootstrap admin app -->
  <script type="module">
    import('./js/admin-app.js')
      .catch((err) => {
        console.error('[Admin Bootstrap]', err);
        document.getElementById('admin-app').innerHTML = `
          <div style="padding: 2rem; text-align: center; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; font-family: sans-serif;">
            <h2 style="color: #ef4444;">⚠️ No se pudo cargar el panel admin</h2>
            <p id="admin-boot-error" style="color: #666; max-width: 400px;"></p>
            <p style="color: #999; font-size: 0.75rem;">Verifica que js/supabase-config.js exista y tengas permisos de administrador.</p>
            <a href="./index.html" style="padding: 0.5rem 1.5rem; background: #10b981; color: white; text-decoration: none; border-radius: 0.5rem; font-size: 1rem;">Volver al inicio</a>
          </div>
        `;
        // Mensaje de error vía textContent (nunca interpolado en innerHTML — evita XSS)
        const errEl = document.getElementById('admin-boot-error');
        if (errEl) errEl.textContent = (err && (err.message || String(err))) || 'Error desconocido';
      });
  </script>
</body>
</html>
