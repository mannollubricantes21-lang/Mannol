name: Tasa elTOQUE

# v5.37.0: la tasa se actualiza sola cada 15 min, igual que en TiendaMax.
# Solo hace falta UN secreto: ELTOQUE_API_KEY
#   (Settings → Secrets and variables → Actions → New repository secret)
# Guarda la tasa en tasa.json junto a la app; cada almacén la lee de ahí y le
# suma el margen de Admin → Tasas (+10 / +20 MN).
# Opcionales: SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY (también la guarda en
# Supabase) y TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (aviso cuando cambia).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tasa-eltoque
  cancel-in-progress: false

jobs:
  tasa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Leer tasa de elTOQUE
        env:
          ELTOQUE_API_KEY: ${{ secrets.ELTOQUE_API_KEY }}
          ELTOQUE_API_URL: ${{ secrets.ELTOQUE_API_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/tasa-eltoque.mjs
      - name: Publicar tasa.json (solo si cambió)
        run: |
          if [ -n "$(git status --porcelain tasa.json)" ]; then
            git config user.name "tasa-bot"
            git config user.email "tasa-bot@users.noreply.github.com"
            git add tasa.json
            git commit -m "Tasa elTOQUE $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash || true
            git push
          else
            echo "Sin cambios en tasa.json"
          fi
